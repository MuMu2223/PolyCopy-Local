<!-- web/static/index.html -->
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyCopy OS | 顶尖胜率玩家跟单系统</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"PingFang SC"', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
          },
          colors: {
            apple: {
              card: 'rgba(28, 28, 30, 0.65)',
              border: 'rgba(255, 255, 255, 0.12)',
              subtle: 'rgba(255, 255, 255, 0.05)',
              accent: '#0A84FF',
              success: '#30D158',
              warning: '#FFD60A',
              danger: '#FF453A',
              purple: '#BF5AF2'
            }
          },
          boxShadow: {
            'apple-glass': '0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15)',
            'apple-inner': 'inset 0 1px 1px rgba(255, 255, 255, 0.1)',
          }
        }
      }
    }
  </script>
  <style>
    /* Apple 标志性极光背景光晕 */
    body {
      background-color: #000000;
      background-image: 
        radial-gradient(at 10% 15%, rgba(10, 132, 255, 0.18) 0px, transparent 55%),
        radial-gradient(at 85% 20%, rgba(191, 90, 242, 0.16) 0px, transparent 50%),
        radial-gradient(at 50% 85%, rgba(48, 209, 88, 0.12) 0px, transparent 60%);
      background-attachment: fixed;
    }

    /* 极致毛玻璃面板基类 */
    .glass-card {
      background: rgba(24, 24, 28, 0.55);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-card-hover {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-hover:hover {
      background: rgba(32, 32, 38, 0.7);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    /* 自定义纤细滚动条 (macOS 风格) */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-screen font-sans text-slate-100 antialiased selection:bg-apple-accent/30 selection:text-white">

  <!-- Apple 风格浮动顶栏 (Floating Island Bar) -->
  <header class="sticky top-4 z-50 max-w-7xl mx-auto px-4 sm:px-6">
    <div class="glass-card rounded-2xl px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-apple-accent to-apple-purple flex items-center justify-center shadow-lg shadow-apple-accent/25 border border-white/20">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-base font-semibold tracking-tight text-white/95">PolyCopy</span>
            <span class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-white/10 text-white/70 border border-white/10 backdrop-blur-md">8899</span>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- 运行状态指示微胶囊 -->
        <div id="system-status-badge" class="px-3.5 py-1.5 rounded-full text-xs font-medium tracking-wide bg-amber-400/10 text-amber-300 border border-amber-400/20 backdrop-blur-xl flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span>连接中...</span>
        </div>
        <!-- 熔断状态胶囊 -->
        <div id="circuit-breaker-badge" class="hidden px-3.5 py-1.5 rounded-full text-xs font-medium bg-apple-danger/15 text-apple-danger border border-apple-danger/30 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span>已触发亏损熔断</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 主控制面板 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-6 pb-12 space-y-6">

    <!-- 1. 四大核心指标卡片 (Apple 紧凑磁贴设计) -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <!-- 账户可用余额 -->
      <div class="glass-card glass-card-hover rounded-3xl p-5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-white/60">
          <span class="text-xs font-medium tracking-wider uppercase">可用资产 (USDC)</span>
          <span class="p-1.5 rounded-xl bg-white/5 border border-white/10 text-apple-accent">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </span>
        </div>
        <div class="mt-4">
          <div id="stat-balance" class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">$0.00</div>
          <p class="text-[11px] text-white/40 mt-1">智能资金池</p>
        </div>
      </div>

      <!-- 今日累计损益 -->
      <div class="glass-card glass-card-hover rounded-3xl p-5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-white/60">
          <span class="text-xs font-medium tracking-wider uppercase">今日累计损益</span>
          <span class="p-1.5 rounded-xl bg-white/5 border border-white/10 text-apple-danger">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"/></svg>
          </span>
        </div>
        <div class="mt-4">
          <div id="stat-loss" class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">$0.00</div>
          <p class="text-[11px] text-white/40 mt-1">熔断线保护中</p>
        </div>
      </div>

      <!-- 跟单缩放比例 -->
      <div class="glass-card glass-card-hover rounded-3xl p-5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-white/60">
          <span class="text-xs font-medium tracking-wider uppercase">跟单比例 (Ratio)</span>
          <span class="p-1.5 rounded-xl bg-white/5 border border-white/10 text-apple-purple">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          </span>
        </div>
        <div class="mt-4">
          <div id="stat-ratio" class="text-2xl sm:text-3xl font-semibold tracking-tight text-apple-purple">0%</div>
          <p class="text-[11px] text-white/40 mt-1">自动资金换算</p>
        </div>
      </div>

      <!-- 当前活跃持仓 -->
      <div class="glass-card glass-card-hover rounded-3xl p-5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-white/60">
          <span class="text-xs font-medium tracking-wider uppercase">活跃持仓头寸</span>
          <span class="p-1.5 rounded-xl bg-white/5 border border-white/10 text-apple-success">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          </span>
        </div>
        <div class="mt-4">
          <div id="stat-positions" class="text-2xl sm:text-3xl font-semibold tracking-tight text-apple-success">0</div>
          <p class="text-[11px] text-white/40 mt-1">本地镜像仓位</p>
        </div>
      </div>

    </section>

    <!-- 2. 中间主力板块：Top 100 榜单 + 本地活跃持仓 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- 左侧：前 100 名高胜率玩家 (占 2 栏) -->
      <section class="lg:col-span-2 glass-card rounded-3xl flex flex-col h-[520px] overflow-hidden">
        <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-white/[0.02]">
          <div class="flex items-center space-x-2.5">
            <span class="w-2.5 h-2.5 rounded-full bg-apple-accent shadow-sm shadow-apple-accent"></span>
            <h2 class="text-sm font-semibold tracking-tight text-white/95">前 100 名顶尖胜率玩家排行</h2>
          </div>
          <span id="traders-count" class="text-xs font-mono text-white/40 bg-white/5 px-2.5 py-1 rounded-full border border-white/5">0 人正在监控</span>
        </div>

        <div class="flex-1 overflow-y-auto px-2">
          <table class="w-full text-left text-xs text-white/80">
            <thead class="sticky top-0 bg-black/40 backdrop-blur-xl text-white/40 uppercase text-[10px] tracking-wider border-b border-white/5">
              <tr>
                <th class="py-3 px-4">排名</th>
                <th class="py-3 px-4">地址</th>
                <th class="py-3 px-4">综合胜率</th>
                <th class="py-3 px-4">历史总盈利</th>
                <th class="py-3 px-4">成交频次</th>
              </tr>
            </thead>
            <tbody id="traders-table-body" class="divide-y divide-white/[0.04]">
              <tr>
                <td colspan="5" class="py-16 text-center text-white/30 font-sans">正在拉取 Polymarket 玩家榜单...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 右侧：本地当前活跃持仓 (占 1 栏) -->
      <section class="glass-card rounded-3xl flex flex-col h-[520px] overflow-hidden">
        <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-white/[0.02]">
          <div class="flex items-center space-x-2.5">
            <span class="w-2.5 h-2.5 rounded-full bg-apple-success shadow-sm shadow-apple-success"></span>
            <h2 class="text-sm font-semibold tracking-tight text-white/95">本地持仓资产</h2>
          </div>
          <span class="text-xs text-white/40 font-mono">Live</span>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="positions-container">
          <div class="h-full flex flex-col items-center justify-center text-white/30 text-xs space-y-2">
            <svg class="w-8 h-8 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
            <span>暂无活跃持仓</span>
          </div>
        </div>
      </section>

    </div>

    <!-- 3. 下半部：跟单明细 + 玻璃终端日志 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- 跟单记录 -->
      <section class="glass-card rounded-3xl flex flex-col h-[380px] overflow-hidden">
        <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-white/[0.02]">
          <h2 class="text-sm font-semibold tracking-tight text-white/95">最近跟单历史 (Latest 50)</h2>
          <span class="text-xs text-white/40 font-mono">自动同步</span>
        </div>
        <div class="flex-1 overflow-y-auto px-2">
          <table class="w-full text-left text-xs text-white/80">
            <thead class="sticky top-0 bg-black/40 backdrop-blur-xl text-white/40 uppercase text-[10px] tracking-wider border-b border-white/5">
              <tr>
                <th class="py-3 px-4">时间</th>
                <th class="py-3 px-4">动作</th>
                <th class="py-3 px-4">金额</th>
                <th class="py-3 px-4">成交价</th>
                <th class="py-3 px-4">状态</th>
              </tr>
            </thead>
            <tbody id="trades-table-body" class="divide-y divide-white/[0.04]">
              <tr>
                <td colspan="5" class="py-14 text-center text-white/30">尚无跟单成交记录</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 系统实时玻璃控制台 -->
      <section class="glass-card rounded-3xl flex flex-col h-[380px] overflow-hidden">
        <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-white/[0.02]">
          <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-white/20"></div>
            <div class="w-3 h-3 rounded-full bg-white/20"></div>
            <div class="w-3 h-3 rounded-full bg-white/20"></div>
            <span class="text-xs font-mono text-white/50 ml-2">Console Terminal</span>
          </div>
          <span class="text-[10px] font-mono text-apple-accent bg-apple-accent/10 px-2 py-0.5 rounded border border-apple-accent/20">Active</span>
        </div>
        <div id="logs-container" class="flex-1 overflow-y-auto p-4 space-y-1.5 font-mono text-[11px] bg-black/30">
          <div class="text-white/30">初始化控制台终端中...</div>
        </div>
      </section>

    </div>
  </main>

  <!-- 业务交互与定时刷新 JS -->
  <script>
    function formatAddress(addr) {
      if (!addr || addr.length < 10) return addr || '';
      return `${addr.substring(0, 6)}...${addr.substring(addr.length - 4)}`;
    }

    function formatUSD(num) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num || 0);
    }

    // 1. 系统状态与概览数据拉取
    async function fetchSystemStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        document.getElementById('stat-balance').innerText = formatUSD(data.balance_usd);
        document.getElementById('stat-loss').innerText = formatUSD(data.today_loss_usd);
        document.getElementById('stat-ratio').innerText = `${((data.copy_ratio || 0) * 100).toFixed(0)}%`;

        const badge = document.getElementById('system-status-badge');
        if (data.dry_run) {
          badge.innerHTML = `
            <span class="w-2 h-2 rounded-full bg-apple-warning"></span>
            <span>模拟盘运行中 (DRY RUN)</span>
          `;
          badge.className = 'px-3.5 py-1.5 rounded-full text-xs font-medium bg-amber-400/10 text-amber-300 border border-amber-400/25 backdrop-blur-xl flex items-center gap-2';
        } else {
          badge.innerHTML = `
            <span class="w-2 h-2 rounded-full bg-apple-success animate-pulse"></span>
            <span>实盘自动跟单 (LIVE)</span>
          `;
          badge.className = 'px-3.5 py-1.5 rounded-full text-xs font-medium bg-emerald-400/10 text-emerald-300 border border-emerald-400/25 backdrop-blur-xl flex items-center gap-2';
        }

        const circuitBadge = document.getElementById('circuit-breaker-badge');
        if (data.is_circuit_breaker_triggered) {
          circuitBadge.classList.remove('hidden');
        } else {
          circuitBadge.classList.add('hidden');
        }
      } catch (err) {
        console.error('更新系统状态失败:', err);
      }
    }

    // 2. 玩家排行榜
    async function fetchTraders() {
      try {
        const res = await fetch('/api/traders');
        const json = await res.json();
        const traders = json.data || [];

        document.getElementById('traders-count').innerText = `${traders.length} 人监控中`;
        const tbody = document.getElementById('traders-table-body');

        if (traders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-14 text-center text-white/30">暂无玩家数据</td></tr>';
          return;
        }

        tbody.innerHTML = traders.map(t => `
          <tr class="hover:bg-white/[0.04] transition-colors duration-150">
            <td class="py-3 px-4 font-mono font-bold text-white/50">#${t.rank}</td>
            <td class="py-3 px-4 font-mono text-apple-accent hover:underline cursor-pointer">${formatAddress(t.address)}</td>
            <td class="py-3 px-4">
              <div class="flex items-center space-x-2">
                <span class="font-semibold text-apple-success">${((t.win_rate || 0) * 100).toFixed(1)}%</span>
                <div class="w-16 h-1.5 rounded-full bg-white/10 overflow-hidden hidden sm:block">
                  <div class="h-full bg-apple-success rounded-full" style="width: ${Math.min(100, (t.win_rate || 0) * 100)}%"></div>
                </div>
              </div>
            </td>
            <td class="py-3 px-4 font-mono font-medium ${t.total_pnl >= 0 ? 'text-apple-success' : 'text-apple-danger'}">${formatUSD(t.total_pnl)}</td>
            <td class="py-3 px-4 font-mono text-white/50">${t.total_trades || 0}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('更新排行榜失败:', err);
      }
    }

    // 3. 持仓卡片
    async function fetchPositions() {
      try {
        const res = await fetch('/api/positions');
        const json = await res.json();
        const positions = json.data || [];

        document.getElementById('stat-positions').innerText = positions.length;
        const container = document.getElementById('positions-container');

        if (positions.length === 0) {
          container.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-white/30 text-xs space-y-2">
              <svg class="w-8 h-8 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
              <span>暂无活跃持仓</span>
            </div>
          `;
          return;
        }

        container.innerHTML = positions.map(p => `
          <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/10 hover:border-white/20 transition space-y-1.5">
            <div class="flex justify-between items-center text-xs">
              <span class="font-mono text-white/50">Token: ${formatAddress(p.token_id || p.condition_id)}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-apple-accent/15 text-apple-accent border border-apple-accent/25">持有中</span>
            </div>
            <div class="flex justify-between items-baseline pt-1">
              <span class="text-sm font-semibold text-white">${p.shares.toFixed(2)} 份</span>
              <span class="text-xs text-white/60 font-mono">成本: $${p.avg_cost.toFixed(3)}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('更新持仓失败:', err);
      }
    }

    // 4. 跟单交易历史
    async function fetchTrades() {
      try {
        const res = await fetch('/api/trades');
        const json = await res.json();
        const trades = json.data || [];
        const tbody = document.getElementById('trades-table-body');

        if (trades.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-14 text-center text-white/30">尚无跟单记录</td></tr>';
          return;
        }

        tbody.innerHTML = trades.map(tr => {
          const isFilled = tr.status === 'FILLED' || tr.status === 'DRY_RUN';
          return `
            <tr class="hover:bg-white/[0.04] transition-colors duration-150">
              <td class="py-3 px-4 font-mono text-white/40">${(tr.created_at || '').substring(11, 19)}</td>
              <td class="py-3 px-4 font-bold ${tr.action_type === 'CLOSE' ? 'text-apple-warning' : 'text-apple-accent'}">${tr.action_type}</td>
              <td class="py-3 px-4 font-mono font-medium text-white">${formatUSD(tr.copy_amount_usd)}</td>
              <td class="py-3 px-4 font-mono text-white/70">$${(tr.price || 0).toFixed(3)}</td>
              <td class="py-3 px-4">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-mono ${
                  isFilled 
                    ? 'bg-apple-success/15 text-apple-success border border-apple-success/25' 
                    : 'bg-apple-danger/15 text-apple-danger border border-apple-danger/25'
                }">${tr.status}</span>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('更新交易记录失败:', err);
      }
    }

    // 5. 控制台日志
    async function fetchLogs() {
      try {
        const res = await fetch('/api/logs');
        const json = await res.json();
        const logs = json.data || [];
        const container = document.getElementById('logs-container');

        if (logs.length === 0) return;

        container.innerHTML = logs.map(l => {
          let levelClass = 'text-white/60';
          if (l.level === 'ERROR') levelClass = 'text-apple-danger font-semibold';
          if (l.level === 'WARNING') levelClass = 'text-apple-warning';
          if (l.level === 'INFO') levelClass = 'text-apple-accent';
          return `
            <div class="leading-relaxed">
              <span class="text-white/20">[${(l.created_at || '').substring(11, 19)}]</span>
              <span class="${levelClass}">[${l.level}]</span>
              <span class="text-white/80">${l.message}</span>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('更新日志失败:', err);
      }
    }

    // 启动轮询机制
    function startPolling() {
      fetchSystemStatus();
      fetchTraders();
      fetchPositions();
      fetchTrades();
      fetchLogs();

      setInterval(fetchSystemStatus, 3000);
      setInterval(fetchPositions, 3000);
      setInterval(fetchTrades, 3000);
      setInterval(fetchLogs, 2000);
      setInterval(fetchTraders, 15000);
    }

    window.addEventListener('DOMContentLoaded', startPolling);
  </script>
</body>
</html>
