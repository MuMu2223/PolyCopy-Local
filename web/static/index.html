<!-- 在 index.html 主内容顶部插入沙盒控制栏 -->
<div class="glass-card rounded-3xl p-5 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
  <div class="flex items-center space-x-3 w-full md:w-auto">
    <div class="w-2.5 h-2.5 rounded-full bg-apple-purple animate-ping"></div>
    <div>
      <div class="text-sm font-semibold text-white">沙盒模拟本金调节</div>
      <div class="text-xs text-white/50">支持在 $100 ~ $1,000,000 USD 之间无损试运行</div>
    </div>
  </div>

  <div class="flex items-center gap-4 w-full md:w-auto justify-end">
    <input type="range" id="capital-slider" min="100" max="1000000" step="100" value="10000" 
           class="w-48 h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-apple-accent"
           oninput="document.getElementById('slider-val').innerText = '$' + Number(this.value).toLocaleString()">
    <span id="slider-val" class="font-mono text-sm font-bold text-apple-accent w-28">$10,000</span>
    <button onclick="updateSandboxCapital()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-white/10 hover:bg-white/20 border border-white/15 transition active:scale-95">
      应用资金
    </button>
  </div>
</div>

<script>
async function updateSandboxCapital() {
  const val = parseFloat(document.getElementById('capital-slider').value);
  const res = await fetch('/api/sandbox/capital', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ amount: val })
  });
  const data = await res.json();
  if (data.status === 'SUCCESS') {
    fetchSystemStatus();
  }
}
</script>
